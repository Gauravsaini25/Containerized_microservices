# Horizontal Pod Autoscaler for Backend
# ========================================
# K8s equivalent of Algorithm 1 (Service Orchestration with Auto-Scaling)
#
# Comparison:
#   Swarm (Algorithm 1):
#     - Custom Python orchestrator
#     - Monitors memory via Docker Stats API
#     - Scale UP when avg memory > 70%
#     - Scale DOWN when avg memory < 30%
#     - Cooldowns: 30s (up), 60s (down)
#     - Range: 2-8 replicas
#
#   Kubernetes (HPA):
#     - Built-in controller
#     - Monitors CPU via Metrics Server
#     - Scale UP when avg CPU > 70%
#     - Scale DOWN when avg CPU < target (with stabilization window)
#     - Built-in stabilization: 300s (down), 0s (up)
#     - Range: 2-8 replicas (same as Swarm)
#
# Note: HPA requires metrics-server to be installed.
# Docker Desktop Kubernetes includes metrics-server by default.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: cc-research
  labels:
    app: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
