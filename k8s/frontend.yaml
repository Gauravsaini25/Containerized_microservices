# Frontend (Nginx) Deployment & Service for Kubernetes
# ======================================================
# Serves the dashboard and proxies API requests to backend.
# Uses NodePort on 30888 to avoid conflict with Swarm's port 8888.
#
# Key difference: In Swarm, Nginx proxies to the custom Load Balancer
# (Algorithm 2). In K8s, Nginx proxies directly to the backend Service
# which uses default kube-proxy round-robin.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cc-research
  labels:
    app: frontend
    component: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        component: proxy
    spec:
      containers:
        - name: frontend
          image: cc-research-frontend:v2
          imagePullPolicy: IfNotPresent  # Use local images
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: "250m"
              memory: "128Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
          # Mount the K8s-specific nginx config
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
---
# NodePort Service - exposes on port 30888
# Equivalent to Swarm's published port 8888
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cc-research
  labels:
    app: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30888
      protocol: TCP
